name: PWA Stealth WSOD & WAF Monitor

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Stealth PWA Health Check
        env:
          PWA_URL: 'https://foo.bar'
        run: node test1.js

      - name: Upload Failure Artifacts (Screenshot & HAR)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wsod-waf-failure-artifacts
          path: |
            wsod-failure-*.png
            wsod-failure-*.har
          retention-days: 7
