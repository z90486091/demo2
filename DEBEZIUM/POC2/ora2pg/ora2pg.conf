# ============================================================
# ora2pg.conf — Oracle FREEPDB1 -> Postgres target_db
# Place at: ./ora2pg-config/ora2pg.conf
# (mounted into ora2pg container at /data/ora2pg.conf per
#  docker-compose.yml volume: ./ora2pg-config:/data)
# ============================================================

#------------------------------------------------------------------------------
# ORACLE DATABASE CONNECTION
#------------------------------------------------------------------------------
ORACLE_DSN	dbi:Oracle:host=oracle;service_name=FREEPDB1;port=1521
ORACLE_USER	c##dbzuser
ORACLE_PWD	oracle

# Schema to export (Oracle owner)
SCHEMA		C##DBZUSER

#------------------------------------------------------------------------------
# POSTGRES TARGET CONNECTION
#------------------------------------------------------------------------------
PG_DSN		dbi:Pg:dbname=target_db;host=postgres;port=5432
PG_USER		postgres
PG_PWD		postgres

# Target schema in Postgres (lowercase per PG convention)
PG_SCHEMA	public

# Target Postgres version (was defaulting to 11, causing wrong DDL dialect)
PG_VERSION	15

# Bitmap indexes default to GIN via btree_gin extension, which needs
# operator classes we haven't installed. Disable to get plain btree
# indexes instead — matches our earlier "convert bitmap to B-tree" call.
BITMAP_AS_GIN	0

#------------------------------------------------------------------------------
# EXPORT TYPE (overridden by -t flag on CLI, this is the default)
#------------------------------------------------------------------------------
EXPORT_TYPE	TABLE

#------------------------------------------------------------------------------
# OUTPUT
#------------------------------------------------------------------------------
OUTPUT		output.sql
OUTPUT_DIR	/data

#------------------------------------------------------------------------------
# BEHAVIOR
#------------------------------------------------------------------------------
# Don't export data here — DML ownership is Debezium's job, not ora2pg's
DATA_EXPORT	0

# Keep case as-is from Oracle where possible, lowercase for PG identifiers
FILE_PER_TABLE	0
PSQL_RELATIVE_PATH	0
DISABLE_UNLOGGED	0

# Preserve NUMBER precision/scale mapping instead of collapsing to numeric
PG_NUMERIC_TYPE	1

# Case-fold identifiers to lowercase on the Postgres side
FORCE_IDENTITY_CASE	lower

#------------------------------------------------------------------------------
# OBJECTS TO INCLUDE/EXCLUDE
#------------------------------------------------------------------------------
# Exclude GTT-backing session tables and Oracle-only diagnostic objects
# if they ever appear under this schema (none currently, placeholder):
# EXCLUDE	STAGING_ORDERS

# Exclude objects ora2pg cannot translate automatically — review manually:
# VARRAY/nested table columns, bitmap indexes, packages need hand review
# even though they'll still attempt export; check output for FIXME/WARNING.

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------
LOGFILE		/data/ora2pg.log
DEBUG		0

DATA_TYPE JSON:TEXT